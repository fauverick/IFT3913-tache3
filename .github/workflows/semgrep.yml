name: Semgrep

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  semgrep:
    name: fail on new findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Scan assigned modules
        run: |
          set -euo pipefail
          PATHS=(
            tika-core
            tika-serialization
            tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module
            tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-pdf-module
            tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module
          )
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          REPORT="semgrep-report-${STAMP}.json"
          echo "SEMGREP_REPORT=${REPORT}" >> "$GITHUB_ENV"
          echo "SEMGREP_REPORT_STAMP=${STAMP}" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
          else
            BASE='${{ github.event.before }}'
          fi
          ARGS=(
            scan
            --config p/java
            --config p/findsecbugs
            --json
            --output "$REPORT"
          )
          if [ -z "$BASE" ] ; then
            echo "No usable baseline commit; scanning without --error so existing findings do not fail the job."
          else
            echo "Diff-aware scan against baseline $BASE"
            ARGS+=(--baseline-commit "$BASE" --error)
          fi
          semgrep "${ARGS[@]}" -- "${PATHS[@]}"

      - name: Upload Semgrep JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report-${{ env.SEMGREP_REPORT_STAMP }}
          path: ${{ env.SEMGREP_REPORT }}
          if-no-files-found: warn
